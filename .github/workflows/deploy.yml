name: Publish AERONAUT game
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Download verified game release
        run: |
          curl --fail --location --retry 3 --output game.tar.gz https://github.com/HackYult/HackYult.github.io/releases/download/v0.1.125/aeronaut-release125.tar.gz
          echo "486cce764b926c5782b8c3fa7cdf1371f88e1b941fa6d33570d2edc1a03dae73  game.tar.gz" | sha256sum --check
          tar -xzf game.tar.gz
          test -f dist/index.html
          touch dist/.nojekyll
      - name: Upload game
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish game
        id: deployment
        uses: actions/deploy-pages@v4

name: Publish AERONAUT game
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Download verified game release
        run: |
          curl --fail --location --retry 3 --output game.tar.gz https://github.com/HackYult/HackYult.github.io/releases/download/v0.1.136/aeronaut-release136.tar.gz?deployment=162
          echo "52d66687ac706caa690a82428605deca950008965b5a87f010d742faf20ff582  game.tar.gz" | sha256sum --check
          tar -xzf game.tar.gz
          curl --fail --location --retry 3 --output navigation-patch.tar.gz https://github.com/HackYult/HackYult.github.io/releases/download/v0.1.155/aeronaut-release155-overlay.tar.gz?deployment=162
          echo "e6401b16e88e41861ca6a93dae8cac0c52a5432d9af29c2405e80c6a57008096  navigation-patch.tar.gz" | sha256sum --check
          tar -xzf navigation-patch.tar.gz
          curl --fail --location --retry 3 --output audio-fix.tar.gz https://github.com/HackYult/HackYult.github.io/releases/download/v0.1.155/aeronaut-release155-audio-fix.tar.gz
          echo "4eb3f1e84453bddd95d7e310b5ba00239c6b17d99d7df6b9e80c0fa4cb0055f2  audio-fix.tar.gz" | sha256sum --check
          tar -xzf audio-fix.tar.gz
          curl --fail --location --retry 3 --output alerts156.tar.gz https://github.com/HackYult/HackYult.github.io/releases/download/v0.1.156/aeronaut-release156-overlay.tar.gz
          echo "55b83e7d897afe9e7e3ab05f49ffa9d2e1937d3f5d8332abe9d153b53a0fbfde  alerts156.tar.gz" | sha256sum --check
          tar -xzf alerts156.tar.gz
          curl --fail --location --retry 3 --output weather157.tar.gz https://github.com/HackYult/HackYult.github.io/releases/download/v0.1.157/aeronaut-release157-overlay.tar.gz
          echo "68d273087a48574ce8060eab274d72d21dd89276246354a09420ed7906d293d2  weather157.tar.gz" | sha256sum --check
          tar -xzf weather157.tar.gz
          curl --fail --location --retry 3 --output alerts158.tar.gz https://github.com/HackYult/HackYult.github.io/releases/download/v0.1.158/aeronaut-release158-overlay.tar.gz
          echo "c01775a3873abe6ab9128e6146daebb05e62ffd5770940ed5166f8d2d6234cd6  alerts158.tar.gz" | sha256sum --check
          tar -xzf alerts158.tar.gz
          curl --fail --location --retry 3 --output performance159.tar.gz https://github.com/HackYult/HackYult.github.io/releases/download/v0.1.159/aeronaut-release159-overlay.tar.gz
          echo "56b63112b23416ca930e9a5e639437e360c6ba1051c2daa50d38a3997fc5ff76  performance159.tar.gz" | sha256sum --check
          tar -xzf performance159.tar.gz
          curl --fail --location --retry 3 --output terminals160.tar.gz https://github.com/HackYult/HackYult.github.io/releases/download/v0.1.160/aeronaut-release160-overlay.tar.gz
          echo "437c7fb42a2b3740af6fa227bdfa954f109c0c6bfb30b33cad2a414478dab16b  terminals160.tar.gz" | sha256sum --check
          tar -xzf terminals160.tar.gz
          curl --fail --location --retry 3 --output terminals161.tar.gz https://github.com/HackYult/HackYult.github.io/releases/download/v0.1.161/aeronaut-release161-overlay.tar.gz
          echo "73195cd3679b16a545282e61c5da5a2e50405b635bef8567ee9c57b2649502b4  terminals161.tar.gz" | sha256sum --check
          tar -xzf terminals161.tar.gz
          curl --fail --location --retry 3 --output terminals162.tar.gz https://github.com/HackYult/HackYult.github.io/releases/download/v0.1.162/aeronaut-release162-overlay.tar.gz
          echo "5a59bfa143f5d0a3701958c9d2b2a46e707352e951f49a5f4ec2587b4bc77867  terminals162.tar.gz" | sha256sum --check
          tar -xzf terminals162.tar.gz
          curl --fail --location --retry 3 --output restoration170.tar.gz https://github.com/HackYult/HackYult.github.io/releases/download/v0.1.170/aeronaut-release170-overlay.tar.gz
          echo "d982b5977cce539025b34e373e7e16cfdbb90e118f817084f647e9f3635dad88  restoration170.tar.gz" | sha256sum --check
          tar -xzf restoration170.tar.gz
          curl --fail --location --retry 3 --output startup171.tar.gz https://github.com/HackYult/HackYult.github.io/releases/download/v0.1.171/aeronaut-release171-overlay.tar.gz
          echo "4bb17127fdb7bde1c753b0eb0565dfade21ce27d0bb30e9fb40cce7176087d15  startup171.tar.gz" | sha256sum --check
          tar -xzf startup171.tar.gz
          curl --fail --location --retry 3 --output takeoff172.tar.gz https://github.com/HackYult/HackYult.github.io/releases/download/v0.1.172/aeronaut-release172-overlay.tar.gz
          echo "c5544f26bec926c87b05b0827bc6a0ba83aec3568e143e565e18210ead854ba9  takeoff172.tar.gz" | sha256sum --check
          tar -xzf takeoff172.tar.gz
          curl --fail --location --retry 3 --output runways173.tar.gz https://github.com/HackYult/HackYult.github.io/releases/download/v0.1.173/aeronaut-release173-overlay.tar.gz
          echo "b064640c8820abaa0d2af705c560d19a4a719b02eb66cc2d28de748853f3d83f  runways173.tar.gz" | sha256sum --check
          tar -xzf runways173.tar.gz
          curl --fail --location --retry 3 --output airfield174.tar.gz https://github.com/HackYult/HackYult.github.io/releases/download/v0.1.174/aeronaut-release174-overlay.tar.gz
          echo "6ac6cc00903b6cc38152a013d870f15292f4effeb0eca0d4bbb494443024f0e6  airfield174.tar.gz" | sha256sum --check
          tar -xzf airfield174.tar.gz
          curl --fail --location --retry 3 --output descent175.tar.gz https://github.com/HackYult/HackYult.github.io/releases/download/v0.1.175/aeronaut-release175-overlay.tar.gz
          echo "4fdb85bcf80c86167802078c299940785c688775d1f3920faf3d547193ab9734  descent175.tar.gz" | sha256sum --check
          tar -xzf descent175.tar.gz
          curl --fail --location --retry 3 --output night176.tar.gz https://github.com/HackYult/HackYult.github.io/releases/download/v0.1.176/aeronaut-release176-overlay.tar.gz
          echo "dce7108dc35f852e0d13c47e22d4fd30dc554f9ff5d805479d9a1ddb1cdfb8e6  night176.tar.gz" | sha256sum --check
          tar -xzf night176.tar.gz
          curl --fail --location --retry 3 --output airfield177.tar.gz https://github.com/HackYult/HackYult.github.io/releases/download/v0.1.177/aeronaut-release177-overlay.tar.gz
          echo "8bc4c1b593956377cac840f484266eee90dd8a49d3715e6fb4269dc08b06a0dd  airfield177.tar.gz" | sha256sum --check
          tar -xzf airfield177.tar.gz
          curl --fail --location --retry 3 --output airfield178.tar.gz https://github.com/HackYult/HackYult.github.io/releases/download/v0.1.178/aeronaut-release178-overlay.tar.gz
          echo "eb92a102bee48262ae0ee6b4face5b893be7a521e1bd88119e8b1c86d8828ae1  airfield178.tar.gz" | sha256sum --check
          tar -xzf airfield178.tar.gz
          # Keep the taxi card readable alongside expanded radar and waypoints.
          cat >> dist/flight-layout.css <<'CSS178'
          /* Keep the taxi card readable while the other left-dock panels are open. */
          #tower-radio-panel.taxi-guidance178{flex-shrink:0;min-height:48px;box-sizing:border-box}
          #tower-radio-panel.taxi-guidance178.radio-minimized{overflow:hidden}
          CSS178
          echo "772af41b5d5c1bdcd2640f875776b13a423fbad3579a5371a3a94bd514cada8d  dist/flight-layout.css" | sha256sum --check
          cp dist/flight-layout.css dist/sources/release178/flight-layout.css
          sed -i 's/flight-layout.css?v=178/flight-layout.css?v=178.1/' dist/index.html
          curl --fail --location --retry 3 --output boarding179.tar.gz https://github.com/HackYult/HackYult.github.io/releases/download/v0.1.179/aeronaut-release179-overlay.tar.gz
          echo "cf3add1791bec974ef45fb25c07c93373e2a536e0749cb2f96c75338930a4875  boarding179.tar.gz" | sha256sum --check
          tar -xzf boarding179.tar.gz
          curl --fail --location --retry 3 --output boarding180.tar.gz https://github.com/HackYult/HackYult.github.io/releases/download/v0.1.180/aeronaut-release180-overlay.tar.gz
          echo "cadca1a6b61c09bb311c87382303d55986a7756a60127fcc940260ac312d6801  boarding180.tar.gz" | sha256sum --check
          tar -xzf boarding180.tar.gz
          curl --fail --location --retry 3 --output briefing181.tar.gz https://github.com/HackYult/HackYult.github.io/releases/download/v0.1.181/aeronaut-release181-overlay.tar.gz
          echo "ab5da0aa4c7b9690bc55f878d7a78b0ed9021367ab3f40545bbb53c79c18a307  briefing181.tar.gz" | sha256sum --check
          tar -xzf briefing181.tar.gz
          curl --fail --location --retry 3 --output signs182.tar.gz https://github.com/HackYult/HackYult.github.io/releases/download/v0.1.182/aeronaut-release182-overlay.tar.gz
          echo "72f18c38ee5dc90db2fc85a9c43e64e13016f495053aeeede89b4de4fd419369  signs182.tar.gz" | sha256sum --check
          tar -xzf signs182.tar.gz
          test -f dist/index.html
          touch dist/.nojekyll
      - name: Upload game
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish game
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000

name: Publish AERONAUT game
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Download verified game release
        run: |
          curl --fail --location --retry 3 --output game.tar.gz https://github.com/HackYult/HackYult.github.io/releases/download/v0.1.136/aeronaut-release136.tar.gz?deployment=158
          echo "52d66687ac706caa690a82428605deca950008965b5a87f010d742faf20ff582  game.tar.gz" | sha256sum --check
          tar -xzf game.tar.gz
          curl --fail --location --retry 3 --output navigation-patch.tar.gz https://github.com/HackYult/HackYult.github.io/releases/download/v0.1.155/aeronaut-release155-overlay.tar.gz?deployment=158
          echo "e6401b16e88e41861ca6a93dae8cac0c52a5432d9af29c2405e80c6a57008096  navigation-patch.tar.gz" | sha256sum --check
          tar -xzf navigation-patch.tar.gz
          curl --fail --location --retry 3 --output audio-fix.tar.gz https://github.com/HackYult/HackYult.github.io/releases/download/v0.1.155/aeronaut-release155-audio-fix.tar.gz
          echo "4eb3f1e84453bddd95d7e310b5ba00239c6b17d99d7df6b9e80c0fa4cb0055f2  audio-fix.tar.gz" | sha256sum --check
          tar -xzf audio-fix.tar.gz
          curl --fail --location --retry 3 --output alerts156.tar.gz https://github.com/HackYult/HackYult.github.io/releases/download/v0.1.156/aeronaut-release156-overlay.tar.gz
          echo "55b83e7d897afe9e7e3ab05f49ffa9d2e1937d3f5d8332abe9d153b53a0fbfde  alerts156.tar.gz" | sha256sum --check
          tar -xzf alerts156.tar.gz
          curl --fail --location --retry 3 --output weather157.tar.gz https://github.com/HackYult/HackYult.github.io/releases/download/v0.1.157/aeronaut-release157-overlay.tar.gz
          echo "68d273087a48574ce8060eab274d72d21dd89276246354a09420ed7906d293d2  weather157.tar.gz" | sha256sum --check
          tar -xzf weather157.tar.gz
          curl --fail --location --retry 3 --output alerts158.tar.gz https://github.com/HackYult/HackYult.github.io/releases/download/v0.1.158/aeronaut-release158-overlay.tar.gz
          echo "c01775a3873abe6ab9128e6146daebb05e62ffd5770940ed5166f8d2d6234cd6  alerts158.tar.gz" | sha256sum --check
          tar -xzf alerts158.tar.gz
          test -f dist/index.html
          touch dist/.nojekyll
      - name: Upload game
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish game
        id: deployment
        uses: actions/deploy-pages@v4

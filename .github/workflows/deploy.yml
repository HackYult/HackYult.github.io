name: Publish AERONAUT game
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Download verified game release
        run: |
          curl --fail --location --retry 3 --output game.tar.gz https://github.com/HackYult/HackYult.github.io/releases/download/v0.1.131/aeronaut-release131-final.tar.gz
          echo "6004a07fd27353bf66fb89947d78a6f14968c203dc4b7482e224e2a22726d3e1  game.tar.gz" | sha256sum --check
          tar -xzf game.tar.gz
          test -f dist/index.html
          touch dist/.nojekyll
      - name: Upload game
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish game
        id: deployment
        uses: actions/deploy-pages@v4
